name: angad
description: "Project Angad — AI-powered cybersecurity ecosystem protecting Indian citizens from scams, data leaks, and malicious links."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Animations
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  socket_io_client: ^2.0.3+1

  # Local Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.1
  fl_chart: ^0.69.0
  rxdart: ^0.28.0
  installed_apps: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
